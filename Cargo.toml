[package]
name = "yd"
version = "1.2.0"
edition = "2024"
description = "Fast, friendly yt-dlp front-end: one-shot CLI and interactive TUI"
repository = "https://github.com/Slaviaaa2/yd"
readme = "README.md"
keywords = ["yt-dlp", "youtube", "downloader", "cli", "tui"]
categories = ["command-line-utilities", "multimedia"]

[[bin]]
name = "yd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
dirs = "7.0.0"
flate2 = "1"
ratatui = "0.30.2"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.10", features = ["std"] }
tar = "0.4.46"
toml = "1.2.1"
unicode-width = "0.2.3"
ureq = "3.5.2"
xz2 = { version = "0.1.7", features = ["static"] }
zip = "9.5.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
